<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="100%" height="100%" style="background:#0b0f19;font-family:'Segoe UI',Roboto,monospace;">
  <defs>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d28"/>
      <stop offset="100%" stop-color="#082417"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="socGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="15" width="1360" height="72" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="40" y="45" fill="#38bdf8" font-size="22" font-weight="bold">PLANO TÉCNICO DE PLACA BASE (PCB): ZTE ZXV10 B820C-A15 LE (HYBRID DVB-C + ANDROID TV)</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">FCC ID: Q78-ZXV10B820CA15  |  SoC: Amlogic S905X2 (meson-g12a)  |  RAM: 2GB DDR3 (4x512MB)  |  Flash: 4GB/8GB eMMC  |  Tuner: Coaxial RF DVB-C / QAM J.83B</text>

  <!-- Main PCB Board Outline -->
  <rect x="180" y="150" width="820" height="580" rx="22" fill="url(#pcbGrad)" stroke="#10b981" stroke-width="3"/>
  <!-- Mounting Holes -->
  <circle cx="215" cy="185" r="14" fill="#0b0f19" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,3"/>
  <circle cx="965" cy="185" r="14" fill="#0b0f19" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,3"/>
  <circle cx="215" cy="695" r="14" fill="#0b0f19" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,3"/>
  <circle cx="965" cy="695" r="14" fill="#0b0f19" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,3"/>

  <!-- Silkscreen Board ID -->
  <text x="255" y="185" fill="#a7f3d0" font-size="13" font-weight="bold" opacity="0.85">ZTE ZXV10 B820C-A15 LE  |  BOARD: g12a_u212_v1 (DVBC-HYBRID)</text>

  <!-- REAR PORTS (TOP EDGE OF PCB) -->
  <!-- 12V DC Jack -->
  <rect x="240" y="115" width="68" height="45" rx="4" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
  <text x="274" y="142" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">DC 12V 1.5A</text>

  <!-- RJ-45 Ethernet -->
  <rect x="340" y="110" width="95" height="55" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="387" y="142" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">LAN RJ-45</text>

  <!-- HDMI 2.1 Out -->
  <rect x="465" y="115" width="95" height="42" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <text x="512" y="141" fill="#e0f2fe" font-size="11" font-weight="bold" text-anchor="middle">HDMI 2.1 (4K60)</text>

  <!-- Mini-AV 3.5mm -->
  <rect x="590" y="118" width="60" height="38" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="620" y="141" fill="#f3e8ff" font-size="11" font-weight="bold" text-anchor="middle">Mini-AV</text>

  <!-- RF Coaxial F-Connector (Hybrid DVB-C / QAM Input) -->
  <rect x="700" y="95" width="90" height="62" rx="6" fill="url(#shieldGrad)" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="745" cy="118" r="12" fill="#1e293b" stroke="#fde047" stroke-width="2"/>
  <circle cx="745" cy="118" r="4" fill="#fde047"/>
  <text x="745" y="148" fill="#111827" font-size="11" font-weight="bold" text-anchor="middle">RF IN (75Ω)</text>

  <!-- RF TUNER & QAM DEMODULATOR SHIELD CAN -->
  <rect x="680" y="162" width="240" height="150" rx="6" fill="url(#shieldGrad)" stroke="#f8fafc" stroke-width="2"/>
  <rect x="692" y="174" width="216" height="126" rx="4" fill="#1e293b" opacity="0.88"/>
  <text x="800" y="200" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle">BLINDAJE RF HÍBRIDO DVB-C / QAM</text>
  <text x="800" y="222" fill="#e2e8f0" font-size="11" text-anchor="middle">• Sintonizador Silicio 54–860 MHz</text>
  <text x="800" y="240" fill="#e2e8f0" font-size="11" text-anchor="middle">• Demodulador ITU-T J.83 Annex A/B</text>
  <text x="800" y="258" fill="#e2e8f0" font-size="11" text-anchor="middle">• QAM 64 / 256 → Bus TS0 Paralelo</text>
  <text x="800" y="278" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">• I2C2 (0x60 / 0x10) → Amlogic Demux</text>

  <!-- TS0 Bus Trace from Tuner to SoC -->
  <path d="M 680 250 L 605 250 L 605 350" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="615" y="330" fill="#38bdf8" font-size="11" font-weight="bold">BUS TS0 + I2C2</text>

  <!-- SIDE USB 2.0 PORT (LEFT EDGE) -->
  <rect x="140" y="340" width="52" height="90" rx="4" fill="#334155" stroke="#22c55e" stroke-width="2.5"/>
  <text x="166" y="382" fill="#bbf7d0" font-size="11" font-weight="bold" text-anchor="middle">USB 2.0</text>
  <text x="166" y="398" fill="#bbf7d0" font-size="10" text-anchor="middle">OTG/HOST</text>

  <!-- TOP/FRONT PHYSICAL POWER / RECOVERY BUTTON (BOTTOM EDGE) -->
  <rect x="520" y="705" width="140" height="42" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="2.5"/>
  <circle cx="545" cy="726" r="9" fill="#f43f5e"/>
  <text x="602" y="723" fill="#fecdd3" font-size="11" font-weight="bold" text-anchor="middle">BOTÓN POWER</text>
  <text x="602" y="738" fill="#fda4af" font-size="9.5" text-anchor="middle">(30s al enchufar = Recovery)</text>

  <!-- FRONT LEDs (Red / Green) -->
  <rect x="330" y="708" width="145" height="36" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="352" cy="726" r="7" fill="#ef4444"/>
  <circle cx="374" cy="726" r="7" fill="#22c55e"/>
  <text x="430" y="730" fill="#d1fae5" font-size="11" font-weight="bold" text-anchor="middle">LEDs R/G + IR</text>

  <!-- SoC AMLOGIC S905X2 (CENTER) -->
  <rect x="440" y="350" width="190" height="190" rx="10" fill="url(#socGrad)" stroke="#38bdf8" stroke-width="3"/>
  <rect x="455" y="365" width="160" height="160" rx="6" fill="#090d16" stroke="#475569" stroke-width="1"/>
  <text x="535" y="405" fill="#38bdf8" font-size="17" font-weight="bold" text-anchor="middle">AMLOGIC</text>
  <text x="535" y="430" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">S905X2</text>
  <text x="535" y="452" fill="#94a3b8" font-size="11" text-anchor="middle">Meson G12A (12 nm)</text>
  <text x="535" y="472" fill="#cbd5e1" font-size="11" text-anchor="middle">4x Cortex-A53 @ 1.8 GHz</text>
  <text x="535" y="490" fill="#cbd5e1" font-size="11" text-anchor="middle">GPU ARM Mali-G31 MP2</text>
  <text x="535" y="510" fill="#fbbf24" font-size="10.5" font-weight="bold" text-anchor="middle">Widevine L1 + Nagra CAS</text>

  <!-- 2 GB DDR3 RAM CHIPS (4x 512MB) -->
  <g fill="#1e293b" stroke="#a855f7" stroke-width="2">
    <rect x="440" y="255" width="88" height="58" rx="4"/>
    <rect x="542" y="255" width="88" height="58" rx="4"/>
    <rect x="655" y="365" width="65" height="78" rx="4"/>
    <rect x="655" y="457" width="65" height="78" rx="4"/>
  </g>
  <text x="484" y="282" fill="#e9d5ff" font-size="11" font-weight="bold" text-anchor="middle">DDR3 #1</text>
  <text x="484" y="298" fill="#c084fc" font-size="10" text-anchor="middle">512 MB</text>
  <text x="586" y="282" fill="#e9d5ff" font-size="11" font-weight="bold" text-anchor="middle">DDR3 #2</text>
  <text x="586" y="298" fill="#c084fc" font-size="10" text-anchor="middle">512 MB</text>
  <text x="687" y="402" fill="#e9d5ff" font-size="11" font-weight="bold" text-anchor="middle">DDR3 #3</text>
  <text x="687" y="418" fill="#c084fc" font-size="10" text-anchor="middle">512 MB</text>
  <text x="687" y="494" fill="#e9d5ff" font-size="11" font-weight="bold" text-anchor="middle">DDR3 #4</text>
  <text x="687" y="510" fill="#c084fc" font-size="10" text-anchor="middle">512 MB</text>

  <!-- eMMC FLASH CHIP (4GB / 8GB BGA-153) + MASKROM & ISP POINTS -->
  <rect x="260" y="370" width="135" height="145" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="327" y="400" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">eMMC 5.1</text>
  <text x="327" y="420" fill="#fde68a" font-size="12" font-weight="bold" text-anchor="middle">4 GB / 8 GB</text>
  <text x="327" y="438" fill="#94a3b8" font-size="10.5" text-anchor="middle">BGA-153 (mmcblk0)</text>
  <text x="327" y="458" fill="#38bdf8" font-size="10" text-anchor="middle">Partición conf (4MB)</text>
  <text x="327" y="474" fill="#38bdf8" font-size="10" text-anchor="middle">Partición factory (8MB)</text>
  <text x="327" y="492" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle">MaskROM: CLK → GND</text>

  <!-- ISP / MaskROM Test Pads next to eMMC -->
  <circle cx="412" cy="390" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <text x="424" y="394" fill="#fca5a5" font-size="10" font-weight="bold">CLK</text>
  <circle cx="412" cy="415" r="6" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="424" y="419" fill="#86efac" font-size="10" font-weight="bold">CMD</text>
  <circle cx="412" cy="440" r="6" fill="#38bdf8" stroke="#fff" stroke-width="1.5"/>
  <text x="424" y="444" fill="#7dd3fc" font-size="10" font-weight="bold">DAT0</text>
  <circle cx="412" cy="465" r="6" fill="#eab308" stroke="#fff" stroke-width="1.5"/>
  <text x="424" y="469" fill="#fde047" font-size="10" font-weight="bold">1.8V</text>
  <circle cx="412" cy="490" r="6" fill="#64748b" stroke="#fff" stroke-width="1.5"/>
  <text x="424" y="494" fill="#cbd5e1" font-size="10" font-weight="bold">GND</text>

  <!-- Wi-Fi 5 2x2 MIMO + BT 4.2 LE Module -->
  <rect x="765" y="410" width="185" height="125" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="857" y="438" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">MÓDULO WI-FI / BT</text>
  <text x="857" y="458" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">802.11ac 2x2 MIMO</text>
  <text x="857" y="476" fill="#cbd5e1" font-size="10.5" text-anchor="middle">2.4 GHz + 5 GHz UNII/DFS</text>
  <text x="857" y="494" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Bluetooth 4.2 + BLE (Voz)</text>
  <text x="857" y="514" fill="#86efac" font-size="10" font-weight="bold" text-anchor="middle">MT7668RSN / RTL8822BS</text>

  <!-- UART SERIAL HEADER / PADS (115200 8N1) -->
  <rect x="255" y="575" width="210" height="82" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="360" y="596" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">PUERTO UART (115200 8N1)</text>
  <rect x="275" y="612" width="18" height="18" fill="#eab308" stroke="#fff" stroke-width="1.5"/>
  <text x="284" y="646" fill="#fde047" font-size="10" font-weight="bold" text-anchor="middle">3.3V</text>
  <circle cx="332" cy="621" r="9" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="332" y="646" fill="#86efac" font-size="10" font-weight="bold" text-anchor="middle">TX (TP11)</text>
  <circle cx="388" cy="621" r="9" fill="#38bdf8" stroke="#fff" stroke-width="1.5"/>
  <text x="388" y="646" fill="#7dd3fc" font-size="10" font-weight="bold" text-anchor="middle">RX (TP12)</text>
  <circle cx="440" cy="621" r="9" fill="#64748b" stroke="#fff" stroke-width="1.5"/>
  <text x="440" y="646" fill="#cbd5e1" font-size="10" font-weight="bold" text-anchor="middle">GND</text>

  <!-- DC-DC BUCK REGULATORS (12V -> 5V -> 3.3V / 1.8V / VCORE) -->
  <rect x="235" y="215" width="165" height="105" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="317" y="238" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">ETAPA PMIC / BUCK DC-DC</text>
  <text x="317" y="258" fill="#e2e8f0" font-size="10.5" text-anchor="middle">• Entrada: 12.0V DC (1.5A)</text>
  <text x="317" y="275" fill="#e2e8f0" font-size="10.5" text-anchor="middle">• Buck Primario: +5.0V USB/HDMI</text>
  <text x="317" y="292" fill="#e2e8f0" font-size="10.5" text-anchor="middle">• LDOs: +3.3V / +1.8V / +1.5V DDR3</text>
  <text x="317" y="309" fill="#fde047" font-size="10" font-weight="bold" text-anchor="middle">• VDDEE / VCCK Core: 0.8V–1.02V</text>

  <!-- RIGHT PANEL: TECHNICAL REFERENCE & PINOUT GUIDE -->
  <rect x="1030" y="110" width="350" height="635" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="1050" y="142" fill="#38bdf8" font-size="16" font-weight="bold">GUÍA DE PINOUT Y DESBLOQUEO</text>
  <line x1="1050" y1="154" x2="1360" y2="154" stroke="#334155" stroke-width="1.5"/>

  <text x="1050" y="180" fill="#fbbf24" font-size="13" font-weight="bold">1. Modo MaskROM / WorldCup USB</text>
  <text x="1050" y="200" fill="#cbd5e1" font-size="11.5">• ID USB: VID_1B8E &amp; PID_C003</text>
  <text x="1050" y="218" fill="#cbd5e1" font-size="11.5">• Método: Puentear pin CLK de la eMMC</text>
  <text x="1050" y="234" fill="#cbd5e1" font-size="11.5">  a GND mientras se conecta el cable</text>
  <text x="1050" y="250" fill="#cbd5e1" font-size="11.5">  USB-A Macho a Macho al puerto USB 2.0.</text>
  <text x="1050" y="268" fill="#86efac" font-size="11">• Alternativa desde UART: ejecutar</text>
  <text x="1050" y="284" fill="#38bdf8" font-size="11" font-weight="bold">  g12a_u212_v1# update</text>

  <text x="1050" y="318" fill="#fbbf24" font-size="13" font-weight="bold">2. Desbloqueo de Opciones Desarrollador</text>
  <text x="1050" y="338" fill="#cbd5e1" font-size="11.5">• El bloqueo de izzi/ZTE reside en la</text>
  <text x="1050" y="354" fill="#cbd5e1" font-size="11.5">  partición 'conf' (4 MB, 0x400000).</text>
  <text x="1050" y="372" fill="#cbd5e1" font-size="11.5">• Respaldar 'conf' original con update.exe:</text>
  <text x="1050" y="388" fill="#38bdf8" font-size="10.5">  update mread store conf normal 0x400000 conf.bak</text>
  <text x="1050" y="406" fill="#cbd5e1" font-size="11.5">• Flashear conf limpia (conf.PARTITION):</text>
  <text x="1050" y="422" fill="#38bdf8" font-size="10.5">  update partition conf conf.PARTITION</text>
  <text x="1050" y="440" fill="#86efac" font-size="11">• Al reiniciar, los 7 clics en Compilación</text>
  <text x="1050" y="456" fill="#86efac" font-size="11">  activan ADB sin bloqueo de operador.</text>

  <text x="1050" y="490" fill="#fbbf24" font-size="13" font-weight="bold">3. Consola UART (115200 8N1, 3.3V)</text>
  <text x="1050" y="510" fill="#cbd5e1" font-size="11.5">• TX → RX del adaptador USB-TTL</text>
  <text x="1050" y="528" fill="#cbd5e1" font-size="11.5">• RX → TX del adaptador USB-TTL</text>
  <text x="1050" y="546" fill="#cbd5e1" font-size="11.5">• GND → GND (NO conectar pin 3.3V)</text>
  <text x="1050" y="564" fill="#38bdf8" font-size="11">  setenv -f lock 10100000; saveenv</text>

  <text x="1050" y="598" fill="#f87171" font-size="13" font-weight="bold">4. Regla de Oro (DDR3 vs DDR4)</text>
  <text x="1050" y="618" fill="#fecaca" font-size="11.5">• B820C-A15 LE = 2 GB DDR3 + DVB-C</text>
  <text x="1050" y="636" fill="#fecaca" font-size="11.5">• B866V2 (Xview) = 2 GB DDR4 (sin RF)</text>
  <text x="1050" y="654" fill="#fde047" font-size="11" font-weight="bold">¡NUNCA cruzar bootloader.img entre</text>
  <text x="1050" y="670" fill="#fde047" font-size="11" font-weight="bold">ambos modelos! Conservar siempre el</text>
  <text x="1050" y="686" fill="#fde047" font-size="11" font-weight="bold">bootloader, factory y cri_data nativos.</text>

  <!-- Bottom Footer Legend -->
  <rect x="20" y="765" width="1360" height="155" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="795" fill="#38bdf8" font-size="15" font-weight="bold">TABLA DE VOLTAJES Y PUNTOS DE MEDICIÓN EN PLACA (ZTE ZXV10 B820C-A15 LE)</text>
  <text x="40" y="822" fill="#e2e8f0" font-size="12">• Entrada DC Principal: 12.0V ± 5% (Conector cilíndrico trasero — necesario para alimentar el LNB/Sintonizador Coaxial RF y los convertidores Buck).</text>
  <text x="40" y="844" fill="#e2e8f0" font-size="12">• Bus USB 2.0: 5.0V DC (Cuando se conecta por cable USB-A a USB-A desde la PC en modo WorldCup/MaskROM, el SoC S905X2 y la eMMC se alimentan de los 5V USB).</text>
  <text x="40" y="866" fill="#e2e8f0" font-size="12">• Memoria RAM (4x chips DDR3): VDD_DDR = 1.50V DC (a diferencia de los 1.20V de la DDR4 del B866V2).</text>
  <text x="40" y="888" fill="#e2e8f0" font-size="12">• Memoria eMMC 5.1 (BGA-153): VCC (Núcleo NAND) = 3.3V DC  |  VCCQ (Bus I/O CMD/CLK/DAT0-7) = 1.8V DC.</text>
  <text x="40" y="908" fill="#86efac" font-size="12" font-weight="bold">• Procedimiento Hard Reset sin PC: Desenchufar 12V → Conectar teclado USB → Mantener presionado Botón Power al enchufar 12V por 30s (LED Rojo → Verde) → Wipe Data.</text>
</svg>
