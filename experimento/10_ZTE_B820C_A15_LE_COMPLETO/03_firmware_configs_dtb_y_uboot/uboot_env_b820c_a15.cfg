# ============================================================================
# ENTORNO U-BOOT (PARTITION: env) - ZTE ZXV10 B820C-A15 LE (Amlogic S905X2)
# Plataforma: g12a_u212_2g (2GB DDR3 + 4GB/8GB eMMC + Sintonizador DVB-C/QAM)
# ============================================================================

baudrate=115200
board=franklin_b820c
bootdelay=1
boot_part=boot
recovery_part=recovery
fdt_high=0x20000000
initrd_high=0xFFE00000
loadaddr=0x1080000
dtb_mem_addr=0x1000000

# Estado de bloqueo de Bootloader ZTE (10100000 = Desbloqueado / 10101000 = Bloqueado)
lock=10101000
lock_State=locked

# Parametros de video HDMI e inicializacion CVBS/Mini-AV
outputmode=1080p60hz
hdmimode=1080p60hz
cvbsmode=576cvbs
colorattribute=444,8bit
dolby_status=0
hdr_policy=0

# Configuracion USB OTG / Device Mode (0 = Auto/OTG, 1 = Force Host, 2 = Force Device/ADB)
otg_device=1

# Argumentos pasados al Kernel Linux (bootargs)
initargs=rootfstype=ramfs init=/init console=ttyS0,115200 no_console_suspend earlycon=aml-uart,0xff803000 ramoops.pstore_en=1 ramoops.record_size=0x8000 ramoops.console_size=0x4000

# Secuencia de arranque (verifica USB/SD -> BCB misc -> normal boot)
bootcmd=run start_autoscript; run storeboot
start_autoscript=if usb start; then run start_usb_autoscript; fi;
start_usb_autoscript=if fatload usb 0 1020000 aml_autoscript; then autoscr 1020000; fi;
storeboot=if imgread kernel ${boot_part} ${loadaddr}; then bootm ${loadaddr}; fi; run update;

# Entrada a modo Burning / WorldCup (MaskROM / Fastboot)
update=run usb_burning; run sdc_burning
usb_burning=update 1000
sdc_burning=sdc_burn ${sdcburncfg}

# Comandos utiles desde consola UART (115200 8N1) para habilitar ADB y desbloquear Fastboot:
#   g12a_u212_v1# setenv lock 10100000
#   g12a_u212_v1# setenv otg_device 2
#   g12a_u212_v1# setenv initargs "${initargs} androidboot.selinux=permissive"
#   g12a_u212_v1# saveenv
#   g12a_u212_v1# fastboot
