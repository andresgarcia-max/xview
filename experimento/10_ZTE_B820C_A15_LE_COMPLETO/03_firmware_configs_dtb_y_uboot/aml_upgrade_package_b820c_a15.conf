# ============================================================================
# CONFIGURACION DE EMPAQUETADO AMLOGIC USB BURNING TOOL (aml_upgrade_package.conf)
# Modelo: ZTE ZXV10 B820C-A15 LE (SoC Amlogic S905X2 - 2GB DDR3)
# ADVERTENCIA: Usar SIEMPRE DDR.USB y UBOOT.USB correspondientes a DDR3 del B820C-A15
#              para evitar error de inicializacion BL2.
# ============================================================================

[LIST_NORMAL]
file="DDR.USB"              main_type="USB"           sub_type="DDR"
file="UBOOT.USB"            main_type="USB"           sub_type="UBOOT"
file="aml_sdc_burn.ini"     main_type="ini"           sub_type="aml_sdc_burn"
file="platform.conf"        main_type="conf"          sub_type="platform"
file="dtb.img"              main_type="dtb"           sub_type="meson1"

[LIST_VERIFY]
# IMPORTANTE: NO incluir factory.img ni cri_data.img al flashear otro firmware
# para preservar Widevine L1 Keybox, certificados Nagra CAS y MAC/Serial originales.
file="bootloader.img"       main_type="PARTITION"     sub_type="bootloader"
file="dtb.img"              main_type="PARTITION"     sub_type="_aml_dtb"
file="dtbo.img"             main_type="PARTITION"     sub_type="dtbo"
file="logo.img"             main_type="PARTITION"     sub_type="logo"
file="recovery.img"         main_type="PARTITION"     sub_type="recovery"
file="boot.img"             main_type="PARTITION"     sub_type="boot"
file="vbmeta.img"           main_type="PARTITION"     sub_type="vbmeta"
file="oem.img"              main_type="PARTITION"     sub_type="oem"
file="super.img"            main_type="PARTITION"     sub_type="super"
