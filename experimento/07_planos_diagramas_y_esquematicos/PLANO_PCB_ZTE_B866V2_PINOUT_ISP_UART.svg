<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" style="background:#0b121e; font-family: 'Segoe UI', Consolas, monospace;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16243a" stroke-width="0.7"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1e3352" stroke-width="1.2"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Blueprint Background -->
  <rect width="1200" height="860" fill="url(#grid-major)"/>
  <rect x="15" y="15" width="1170" height="830" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="820" fill="none" stroke="#1d4ed8" stroke-width="1"/>

  <!-- Header Title Block -->
  <rect x="20" y="20" width="1160" height="65" fill="#0f1b2d" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="48" fill="#60a5fa" font-size="20" font-weight="bold">PLANO TÉCNICO PCB Y PINOUT: ZTE ZXV10 B866V2 (XVIEW+ / PLACA FRANKLIN - U212)</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">SoC: Amlogic S905X2 (meson-g12a) | eMMC 5.1 (153-FBGA) | Wi-Fi/BT: MediaTek MT7661LSN | Escala: 1:1 Esquema de Ingeniería</text>
  <text x="1160" y="48" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="end">REV: 2026.10 / DOC-B866V2-01</text>
  <text x="1160" y="70" fill="#64748b" font-size="12" text-anchor="end">VISTA SUPERIOR DE PLACA BASE (TOP VIEW)</text>

  <!-- Main PCB Board Outline -->
  <rect x="70" y="130" width="680" height="620" rx="28" ry="28" fill="#063927" stroke="#10b981" stroke-width="3"/>
  <rect x="78" y="138" width="664" height="604" rx="22" ry="22" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Mounting Holes -->
  <g fill="#0b121e" stroke="#fbbf24" stroke-width="4">
    <circle cx="105" cy="165" r="12"/>
    <circle cx="715" cy="165" r="12"/>
    <circle cx="105" cy="715" r="12"/>
    <circle cx="715" cy="715" r="12"/>
  </g>
  <text x="105" y="192" fill="#fbbf24" font-size="10" text-anchor="middle">GND</text>
  <text x="715" y="192" fill="#fbbf24" font-size="10" text-anchor="middle">GND</text>

  <!-- TOP EDGE PORTS (REAR PANEL OF TV BOX) -->
  <!-- DC 12V IN -->
  <rect x="145" y="105" width="75" height="40" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="182" y="128" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">DC 12V 1A</text>
  
  <!-- Optical / AV / Reset -->
  <rect x="245" y="110" width="65" height="35" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="277" y="132" fill="#e2e8f0" font-size="10" text-anchor="middle">SPDIF/AV</text>

  <!-- HDMI 2.1 Port -->
  <rect x="340" y="102" width="120" height="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="400" y="123" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">HDMI 2.1 OUT</text>
  <text x="400" y="138" fill="#94a3b8" font-size="9" text-anchor="middle">TMDS 4K@60Hz / HDCP 2.2</text>

  <!-- RJ45 Ethernet -->
  <rect x="490" y="100" width="110" height="55" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <text x="545" y="125" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">RJ45 LAN</text>
  <text x="545" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">10/100 Mbps</text>

  <!-- RIGHT EDGE PORTS (SIDE PANEL: USB & MICROSD) -->
  <!-- USB 2.0 PORT 1 (HOST) -->
  <rect x="725" y="250" width="45" height="95" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="747" y="295" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(90, 747, 295)">USB 1 (HOST)</text>

  <!-- USB 2.0 PORT 2 (OTG / USB BURN) -->
  <rect x="725" y="380" width="45" height="105" fill="#1e293b" stroke="#f43f5e" stroke-width="2.5"/>
  <text x="747" y="432" fill="#fda4af" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(90, 747, 432)">USB 2 (OTG/BURN)</text>

  <!-- MicroSD Slot -->
  <rect x="728" y="520" width="38" height="80" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="747" y="560" fill="#cbd5e1" font-size="10" text-anchor="middle" transform="rotate(90, 747, 560)">MicroSD</text>

  <!-- Hidden Reset Switch -->
  <circle cx="695" cy="635" r="9" fill="#ef4444" stroke="#fecaca" stroke-width="2"/>
  <text x="675" y="640" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="end">SW1 (RESET / RECOVERY)</text>

  <!-- CENTER: AMLOGIC S905X2 SoC -->
  <rect x="310" y="330" width="165" height="165" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="322" y="342" width="141" height="141" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="330" cy="350" r="4" fill="#38bdf8"/>
  <text x="392" y="385" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">AMLOGIC</text>
  <text x="392" y="408" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">S905X2</text>
  <text x="392" y="430" fill="#94a3b8" font-size="11" text-anchor="middle">SoC: meson-g12a</text>
  <text x="392" y="448" fill="#94a3b8" font-size="10" text-anchor="middle">4x Cortex-A53 @ 1.8GHz</text>
  <text x="392" y="465" fill="#64748b" font-size="10" text-anchor="middle">GPU: Mali-G31 MP2</text>

  <!-- DDR4 RAM CHIPS (2GB TOTAL) -->
  <rect x="315" y="220" width="75" height="80" rx="3" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="352" y="255" fill="#d8b4fe" font-size="12" font-weight="bold" text-anchor="middle">DDR4 #1</text>
  <text x="352" y="272" fill="#94a3b8" font-size="10" text-anchor="middle">1 GB RAM</text>

  <rect x="405" y="220" width="75" height="80" rx="3" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="442" y="255" fill="#d8b4fe" font-size="12" font-weight="bold" text-anchor="middle">DDR4 #2</text>
  <text x="442" y="272" fill="#94a3b8" font-size="10" text-anchor="middle">1 GB RAM</text>

  <!-- eMMC 5.1 FLASH CHIP (LEFT OF SoC) -->
  <rect x="145" y="345" width="115" height="135" rx="4" fill="#111827" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="158" cy="358" r="3.5" fill="#f59e0b"/>
  <text x="202" y="388" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">eMMC 5.1</text>
  <text x="202" y="408" fill="#f8fafc" font-size="12" text-anchor="middle">8 GB Flash</text>
  <text x="202" y="425" fill="#94a3b8" font-size="10" text-anchor="middle">BGA-153 / 169</text>
  <text x="202" y="445" fill="#fde68a" font-size="9" text-anchor="middle">/dev/block/mmcblk0</text>

  <!-- ISP / MASKROM TEST POINTS NEAR eMMC -->
  <g filter="url(#glow)">
    <!-- CLK -->
    <circle cx="280" cy="365" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
    <!-- CMD -->
    <circle cx="280" cy="388" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="1"/>
    <!-- DAT0 (MASKROM SHORT POINT) -->
    <circle cx="280" cy="411" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
    <!-- VCCQ 1.8V -->
    <circle cx="280" cy="434" r="5" fill="#eab308" stroke="#ffffff" stroke-width="1"/>
    <!-- VCC 3.3V -->
    <circle cx="280" cy="457" r="5" fill="#f97316" stroke="#ffffff" stroke-width="1"/>
  </g>
  <text x="272" y="352" fill="#f8fafc" font-size="9" font-weight="bold">ISP PADS</text>

  <!-- Callout Lines from ISP Pads to Right Side Legend -->
  <polyline points="280,411 280,535 795,535" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="4,2"/>
  <polyline points="280,365 295,365 295,515 795,515" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- MEDIATEK MT7661LSN WI-FI / BT CHIP (BOTTOM LEFT) -->
  <rect x="135" y="555" width="110" height="95" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="190" y="585" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle">MediaTek</text>
  <text x="190" y="603" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">MT7661LSN</text>
  <text x="190" y="620" fill="#94a3b8" font-size="9" text-anchor="middle">Wi-Fi 5 2x2 + BT 5.0</text>
  <text x="190" y="635" fill="#67e8f9" font-size="9" text-anchor="middle">(Driver: mt7663)</text>

  <!-- Antenna Pads -->
  <circle cx="105" cy="575" r="7" fill="#fbbf24" stroke="#0f172a" stroke-width="2"/>
  <text x="105" y="560" fill="#fbbf24" font-size="9" text-anchor="middle">ANT1</text>
  <circle cx="105" cy="630" r="7" fill="#fbbf24" stroke="#0f172a" stroke-width="2"/>
  <text x="105" y="650" fill="#fbbf24" font-size="9" text-anchor="middle">ANT2</text>

  <!-- UART SERIAL HEADER (4 PADS: 3.3V, TX, RX, GND) -->
  <rect x="490" y="575" width="125" height="40" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
  <rect x="502" y="587" width="16" height="16" fill="#eab308"/> <!-- Square pad = Pin 1 (3.3V/VCC) -->
  <circle cx="538" cy="595" r="8" fill="#22c55e"/> <!-- TX -->
  <circle cx="566" cy="595" r="8" fill="#38bdf8"/> <!-- RX -->
  <circle cx="594" cy="595" r="8" fill="#94a3b8"/> <!-- GND -->
  <text x="552" y="567" fill="#fda4af" font-size="12" font-weight="bold" text-anchor="middle">PUERTO UART (115200 8N1)</text>
  <text x="510" y="630" fill="#fde047" font-size="10" text-anchor="middle">3.3V</text>
  <text x="538" y="630" fill="#4ade80" font-size="10" text-anchor="middle">TX</text>
  <text x="566" y="630" fill="#38bdf8" font-size="10" text-anchor="middle">RX</text>
  <text x="594" y="630" fill="#cbd5e1" font-size="10" text-anchor="middle">GND</text>

  <!-- Front LED / IR Receiver -->
  <rect x="330" y="715" width="140" height="28" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="400" y="734" fill="#6ee7b7" font-size="11" font-weight="bold" text-anchor="middle">IR + LED (POWER/NET)</text>

  <!-- RIGHT SIDE PANEL: PINOUT & ENGINEERING TABLES -->
  <!-- Box 1: ISP & MaskROM Pinout Table -->
  <rect x="795" y="130" width="370" height="285" rx="6" fill="#0f1b2d" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="795" y="130" width="370" height="34" rx="6" fill="#1e3a8a"/>
  <text x="980" y="152" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1. PINOUT ISP eMMC Y MODO MASKROM</text>
  
  <text x="810" y="185" fill="#4ade80" font-size="12" font-weight="bold">● DAT0 (Test Point MaskROM):</text>
  <text x="822" y="203" fill="#cbd5e1" font-size="11">Puente a GND al conectar energía + USB 2</text>
  <text x="822" y="218" fill="#94a3b8" font-size="11">para forzar detección en USB Burning Tool.</text>

  <text x="810" y="243" fill="#f87171" font-size="12" font-weight="bold">● CLK (Reloj eMMC):</text>
  <text x="822" y="260" fill="#cbd5e1" font-size="11">Señal de sincronía hacia el SoC S905X2.</text>

  <text x="810" y="285" fill="#60a5fa" font-size="12" font-weight="bold">● CMD (Comandos eMMC):</text>
  <text x="822" y="302" fill="#cbd5e1" font-size="11">Línea bidireccional de comandos ISP.</text>

  <text x="810" y="327" fill="#facc15" font-size="12" font-weight="bold">● VCCQ (1.8V) y VCC (3.3V):</text>
  <text x="822" y="344" fill="#cbd5e1" font-size="11">Alimentación lógica y núcleo de memoria Flash.</text>

  <text x="810" y="369" fill="#94a3b8" font-size="12" font-weight="bold">● GND (Tierra Común):</text>
  <text x="822" y="386" fill="#cbd5e1" font-size="11">Chasis metálico de puertos HDMI / USB / Orificios.</text>

  <!-- Box 2: UART Serial Console Pinout -->
  <rect x="795" y="430" width="370" height="175" rx="6" fill="#0f1b2d" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="795" y="430" width="370" height="34" rx="6" fill="#881337"/>
  <text x="980" y="452" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2. CONSOLA SERIAL UART (U-BOOT)</text>
  <text x="810" y="482" fill="#f8fafc" font-size="12">Parámetros: <tspan fill="#38bdf8" font-weight="bold">115200 baudios, 8N1, Sin flujo</tspan></text>
  <text x="810" y="505" fill="#4ade80" font-size="11">• Pin TX (Placa)  ───► Conectar a RX (USB-TTL)</text>
  <text x="810" y="525" fill="#38bdf8" font-size="11">• Pin RX (Placa)  ───► Conectar a TX (USB-TTL)</text>
  <text x="810" y="545" fill="#cbd5e1" font-size="11">• Pin GND (Placa) ───► Conectar a GND (USB-TTL)</text>
  <text x="810" y="568" fill="#fca5a5" font-size="11" font-weight="bold">⚠ NO CONECTAR EL PIN 3.3V DEL ADAPTADOR USB</text>
  <text x="810" y="585" fill="#94a3b8" font-size="10">La placa genera sus propios 3.3V al encenderse.</text>

  <!-- Box 3: USB Burn Mode Instructions -->
  <rect x="795" y="620" width="370" height="195" rx="6" fill="#0f1b2d" stroke="#10b981" stroke-width="1.5"/>
  <rect x="795" y="620" width="370" height="34" rx="6" fill="#065f46"/>
  <text x="980" y="642" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3. CONEXIÓN USB BURN / PYAMLBOOT</text>
  <text x="810" y="672" fill="#cbd5e1" font-size="11">1. Abrir Amlogic USB Burning Tool v2.2.4 (o pyamlboot).</text>
  <text x="810" y="694" fill="#cbd5e1" font-size="11">2. Preparar cable USB-A Macho a USB-A Macho.</text>
  <text x="810" y="716" fill="#fda4af" font-size="11" font-weight="bold">3. Conectar al PUERTO USB 2 (Central / OTG).</text>
  <text x="810" y="738" fill="#cbd5e1" font-size="11">4. Presionar SW1 (Reset) o puentear DAT0 a GND</text>
  <text x="822" y="756" fill="#cbd5e1" font-size="11">mientras se conecta el cable USB / 12V DC.</text>
  <text x="810" y="780" fill="#6ee7b7" font-size="11">5. El PC detectará: "WorldCup Device" (ID 1b8e:c003).</text>

  <!-- Footer Notes -->
  <text x="70" y="790" fill="#60a5fa" font-size="12" font-weight="bold">IDENTIFICACIÓN DE HARDWARE EXTRAÍDA DEL EQUIPO:</text>
  <text x="70" y="810" fill="#94a3b8" font-size="11">• Plataforma: g12a (Amlogic S905X2) | Board: franklin | Firmware actual: DMC.v2.25 (Viettel V84711310.1024 Android 12)</text>
</svg>
