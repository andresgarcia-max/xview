<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%" style="background:#0b121e; font-family: 'Segoe UI', Consolas, monospace;">
  <defs>
    <pattern id="grid2" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#152238" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="url(#grid2)"/>
  <rect x="15" y="15" width="1170" height="810" fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- Header -->
  <rect x="20" y="20" width="1160" height="60" fill="#0f1b2d" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="46" fill="#60a5fa" font-size="19" font-weight="bold">DIAGRAMA DE BLOQUES: PARTICIONES eMMC, CADENA DE ARRANQUE Y PIPELINE DE VIDEO</text>
  <text x="40" y="66" fill="#94a3b8" font-size="12">Comparativa de Arquitectura: ZTE B866V2 (Amlogic S905X2 - 12nm) vs ZTE B866V6 Modelo 2027 (Amlogic S905X5M - 6nm)</text>
  <text x="1160" y="52" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="end">DOC-B866V2-02</text>

  <!-- SECTION 1: eMMC PARTITION MAP (/dev/block/mmcblk0) -->
  <rect x="35" y="95" width="1130" height="215" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="122" fill="#fbbf24" font-size="15" font-weight="bold">1. MAPA FÍSICO DE PARTICIONES eMMC 8 GB (/dev/block/mmcblk0 — ZTE B866V2 Android 12)</text>

  <!-- Partition Blocks Row 1 -->
  <g transform="translate(55, 138)">
    <rect x="0" y="0" width="95" height="65" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
    <text x="47" y="25" fill="#fecaca" font-size="11" font-weight="bold" text-anchor="middle">bootloader</text>
    <text x="47" y="42" fill="#fca5a5" font-size="9" text-anchor="middle">mmcblk0boot0/1</text>
    <text x="47" y="56" fill="#f87171" font-size="9" text-anchor="middle">4 MB (FIP/BL2/31)</text>

    <rect x="103" y="0" width="75" height="65" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="140" y="25" fill="#bfdbfe" font-size="11" font-weight="bold" text-anchor="middle">env</text>
    <text x="140" y="42" fill="#93c5fd" font-size="9" text-anchor="middle">U-Boot Env</text>
    <text x="140" y="56" fill="#60a5fa" font-size="9" text-anchor="middle">8 MB</text>

    <rect x="186" y="0" width="80" height="65" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="226" y="25" fill="#bfdbfe" font-size="11" font-weight="bold" text-anchor="middle">dtbo / dtb</text>
    <text x="226" y="42" fill="#93c5fd" font-size="9" text-anchor="middle">franklin.dtb</text>
    <text x="226" y="56" fill="#60a5fa" font-size="9" text-anchor="middle">8 MB</text>

    <rect x="274" y="0" width="95" height="65" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="321" y="25" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">boot</text>
    <text x="321" y="42" fill="#6ee7b7" font-size="9" text-anchor="middle">Kernel + Ramdisk</text>
    <text x="321" y="56" fill="#34d399" font-size="9" text-anchor="middle">mmcblk0p12 (64MB)</text>

    <rect x="377" y="0" width="95" height="65" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="424" y="25" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">recovery</text>
    <text x="424" y="42" fill="#6ee7b7" font-size="9" text-anchor="middle">OTA / Factory</text>
    <text x="424" y="56" fill="#34d399" font-size="9" text-anchor="middle">mmcblk0p6 (24MB)</text>

    <rect x="480" y="0" width="95" height="65" rx="4" fill="#581c87" stroke="#c084fc" stroke-width="1.5"/>
    <text x="527" y="25" fill="#e9d5ff" font-size="11" font-weight="bold" text-anchor="middle">tee / factory</text>
    <text x="527" y="42" fill="#d8b4fe" font-size="9" text-anchor="middle">Widevine L1 / MAC</text>
    <text x="527" y="56" fill="#c084fc" font-size="9" text-anchor="middle">cri_data / param</text>

    <rect x="583" y="0" width="275" height="65" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="720" y="22" fill="#fef08a" font-size="12" font-weight="bold" text-anchor="middle">super (Partición Dinámica — mmcblk0p18)</text>
    <text x="720" y="40" fill="#fde68a" font-size="10" text-anchor="middle">[ system | vendor | product | system_ext | odm ]</text>
    <text x="720" y="56" fill="#fbbf24" font-size="9" text-anchor="middle">~1.8 GB (Contiene ROM DMC.v2.25 Android 12)</text>

    <rect x="866" y="0" width="224" height="65" rx="4" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text x="978" y="25" fill="#ccfbf1" font-size="12" font-weight="bold" text-anchor="middle">userdata (/data)</text>
    <text x="978" y="42" fill="#99f6e4" font-size="10" text-anchor="middle">Apps Usuario (Xuper Hydra) + Datos</text>
    <text x="978" y="56" fill="#2dd4bf" font-size="9" text-anchor="middle">~4.6 GB Libres</text>
  </g>

  <text x="55" y="228" fill="#fca5a5" font-size="11" font-weight="bold">⚠ NOTA CRÍTICA DE INGENIERÍA:</text>
  <text x="255" y="228" fill="#cbd5e1" font-size="11">Las particiones "factory", "cri_data" y "tee" almacenan las llaves únicas de serie, MAC Address y certificados DRM Widevine L1.</text>
  <text x="55" y="248" fill="#94a3b8" font-size="11">En Amlogic USB Burning Tool SIEMPRE debe marcarse "Normal Erase" (NUNCA "Erase All") y desmarcar "Erase Bootloader" si no se desea perder Widevine L1.</text>

  <!-- Boot Sequence Chain -->
  <text x="55" y="282" fill="#38bdf8" font-size="12" font-weight="bold">CADENA DE ARRANQUE:</text>
  <text x="215" y="282" fill="#e2e8f0" font-size="11">[1. BootROM BL1 en SoC] ──► [2. BL2 Init DDR4] ──► [3. BL31 TrustZone] ──► [4. U-Boot 2015/2019] ──► [5. boot.img Kernel] ──► [6. Android Init]</text>

  <!-- SECTION 2: VIDEO PIPELINE B866V2 (CURRENT) -->
  <rect x="35" y="325" width="1130" height="230" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="55" y="352" fill="#60a5fa" font-size="15" font-weight="bold">2. PIPELINE DE VIDEO EN TU ZTE B866V2 (S905X2 - Android 12 DMC.v2.25) — ¿POR QUÉ SALE A 1080P?</text>

  <!-- Boxes for B866V2 Pipeline -->
  <g transform="translate(55, 375)">
    <!-- Step 1 -->
    <rect x="0" y="20" width="175" height="95" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="87" y="45" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Servidor Xuper Hydra</text>
    <text x="87" y="65" fill="#94a3b8" font-size="10" text-anchor="middle">Catálogo VOD: 480p/720p/1080p</text>
    <text x="87" y="82" fill="#38bdf8" font-size="10" text-anchor="middle">Pestaña UHD: H.265 4K</text>
    <text x="87" y="100" fill="#64748b" font-size="9" text-anchor="middle">(QualityBeanKt topado a FHD)</text>

    <line x1="175" y1="67" x2="215" y2="67" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="220" y="5" width="225" height="125" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="332" y="28" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Decodificador en App</text>
    <text x="332" y="48" fill="#fca5a5" font-size="10" text-anchor="middle">• Player 1 (IjkMediaPlayer):</text>
    <text x="332" y="63" fill="#94a3b8" font-size="9" text-anchor="middle">Busca "OMX.amlogic.avc.decoder.awesome"</text>
    <text x="332" y="85" fill="#4ade80" font-size="10" text-anchor="middle">• Player 2 (ExoPlayer Nativo):</text>
    <text x="332" y="100" fill="#cbd5e1" font-size="9" text-anchor="middle">Usa "OMX.amlogic.hevc.decoder.awesome2"</text>
    <text x="332" y="116" fill="#6ee7b7" font-size="9" text-anchor="middle">(Soporta hasta 4096x2160 Hardware)</text>

    <line x1="445" y1="67" x2="485" y2="67" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="490" y="20" width="205" height="95" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="592" y="45" fill="#d8b4fe" font-size="12" font-weight="bold" text-anchor="middle">SurfaceFlinger (UI)</text>
    <text x="592" y="65" fill="#f8fafc" font-size="11" text-anchor="middle">Framebuffer: 1920x1080</text>
    <text x="592" y="82" fill="#94a3b8" font-size="10" text-anchor="middle">vendor.display-size=1920x1080</text>
    <text x="592" y="100" fill="#c084fc" font-size="9" text-anchor="middle">Densidad: 320 dpi (2GB RAM)</text>

    <line x1="695" y1="67" x2="735" y2="67" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="740" y="20" width="160" height="95" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="820" y="45" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Salida HDMI TX</text>
    <text x="820" y="65" fill="#e2e8f0" font-size="10" text-anchor="middle">Modo Activo: ID 3</text>
    <text x="820" y="82" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">1920x1080 @ 59.94Hz</text>
    <text x="820" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">Puerto físico: 0x3000</text>

    <line x1="900" y1="67" x2="940" y2="67" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 5 -->
    <rect x="945" y="20" width="145" height="95" rx="5" fill="#3f1d2e" stroke="#f43f5e" stroke-width="2"/>
    <text x="1017" y="45" fill="#fda4af" font-size="12" font-weight="bold" text-anchor="middle">Roku TV (HDMI 3)</text>
    <text x="1017" y="65" fill="#fecdd3" font-size="10" text-anchor="middle">EDID Reportado:</text>
    <text x="1017" y="82" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Máx: 1920x1080</text>
    <text x="1017" y="100" fill="#fda4af" font-size="9" text-anchor="middle">HDR: [] (Sin 4K en EDID)</text>
  </g>

  <!-- SECTION 3: NEXT-GEN PIPELINE B866V6 (2026-2027 MODEL) -->
  <rect x="35" y="575" width="1130" height="230" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="55" y="602" fill="#34d399" font-size="15" font-weight="bold">3. ARQUITECTURA DEL NUEVO MODELO 2026–2027: ZTE B866V6 / B866V6N (Amlogic S905X5M / S905Y5 - 6nm)</text>

  <g transform="translate(55, 625)">
    <rect x="0" y="15" width="205" height="105" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="102" y="40" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle">Nuevo SoC Amlogic 6nm</text>
    <text x="102" y="60" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">S905X5M / S905Y5</text>
    <text x="102" y="78" fill="#a7f3d0" font-size="10" text-anchor="middle">Cortex-A55 @ 2.5GHz (30k DMIPS)</text>
    <text x="102" y="95" fill="#34d399" font-size="9" text-anchor="middle">Códecs: AV1 + H.266 (VVC) + HEVC</text>

    <line x1="205" y1="67" x2="250" y2="67" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>

    <rect x="255" y="15" width="235" height="105" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="372" y="40" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle">Motor NPU AI-SR (Hardware)</text>
    <text x="372" y="60" fill="#f8fafc" font-size="11" text-anchor="middle">AI Super Resolution</text>
    <text x="372" y="78" fill="#a7f3d0" font-size="10" text-anchor="middle">Toma streams 720p/1080p de IPTV</text>
    <text x="372" y="95" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">y los reconstruye a 4K en tiempo real</text>

    <line x1="490" y1="67" x2="535" y2="67" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>

    <rect x="540" y="15" width="235" height="105" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="657" y="40" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle">GPU ARM Mali-G310 V2</text>
    <text x="657" y="60" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Interfaz (UI) en 4K Nativo</text>
    <text x="657" y="78" fill="#a7f3d0" font-size="10" text-anchor="middle">Framebuffer real: 3840x2160</text>
    <text x="657" y="95" fill="#34d399" font-size="9" text-anchor="middle">Android TV 14 / Google TV Fluido</text>

    <line x1="775" y1="67" x2="820" y2="67" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>

    <rect x="825" y="15" width="265" height="105" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="957" y="40" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle">Salida HDMI 2.1a + Wi-Fi 6</text>
    <text x="957" y="60" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">4K@60Hz / QMS / VRR / HDR10+</text>
    <text x="957" y="78" fill="#a7f3d0" font-size="10" text-anchor="middle">Cambio de frecuencia sin pantalla negra</text>
    <text x="957" y="95" fill="#34d399" font-size="9" text-anchor="middle">Dolby Vision + Dolby Atmos Passthrough</text>
  </g>
</svg>
