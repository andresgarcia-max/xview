# ==============================================================================
# CONFIGURACIÓN DE ENTORNO U-BOOT (env) — ZTE ZXV10 B866V2 (Placa: franklin / g12a)
# Procesador: Amlogic S905X2 | Memoria: 2GB DDR4 + 8GB eMMC | Wi-Fi: MT7661LSN
# ==============================================================================

baudrate=115200
board=franklin
soc=g12a
arch=arm
cpu=armv8

# Parámetros de salida de video HDMI y espacio de color (Amlogic VOUT / HDMITX)
hdmimode=1080p60hz
outputmode=1080p60hz
colorattribute=444,8bit
dolby_status=0
hdr_policy=1
frac_rate_policy=1

# Resolución del Framebuffer de interfaz (OSD)
fb_width=1920
fb_height=1080
display_bpp=32
display_color_index=32
display_layer=osd0

# Argumentos pasados al Kernel Linux (cmdline)
initargs=rootfstype=ramfs init=/init console=ttyS0,115200 no_console_suspend earlycon=aml-uart,0xff803000 ramoops.pstore_en=1 ramoops.record_size=0x8000 ramoops.console_size=0x4000

# Comandos de arranque estándar (Android 12 en eMMC)
storeboot=imgread kernel boot ${loadaddr}; bootm ${loadaddr};

# Configuración de Multiboot por USB / SD (Armbian / Debian / CoreELEC / EmuELEC)
# Basado en mirko-geno/b866v2-debian y ophub/amlogic-s9xxx-armbian
start_autoscript=if usb start; then run start_usb_autoscript; fi; if mmcinfo; then run start_mmc_autoscript; fi;
start_usb_autoscript=if fatload usb 0 1020000 s905_autoscript; then autoscr 1020000; fi; if fatload usb 1 1020000 s905_autoscript; then autoscr 1020000; fi;
start_mmc_autoscript=if fatload mmc 0 1020000 s905_autoscript; then autoscr 1020000; fi;
